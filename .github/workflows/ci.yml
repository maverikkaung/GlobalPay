name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Chromium for end-to-end regression tests
        run: npx playwright install --with-deps chromium
      - name: Run public and isolated demo browser tests
        run: npm run test:e2e

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Supabase Auth compatibility fixture
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/migration_fixture.sql
        env:
          PGPASSWORD: postgres
      - name: Apply and verify fresh marketplace base schema
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150000_marketplace_base_schema.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/base_schema_assertions.sql
        env:
          PGPASSWORD: postgres
      - name: Apply marketplace security and feature migrations
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150001_marketplace_security_profiles.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150002_marketplace_communications_reviews.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150003_marketplace_legacy_grant_hardening.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150004_close_messaging_after_application.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150005_restrict_review_record_access.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150006_preserve_jobs_with_applications.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150007_preserve_job_history_trigger.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150008_preserve_withdrawn_applications.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150009_social_marketplace.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150010_contracts_blocks_safety.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150011_allow_shared_post_cleanup.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150012_admin_support_configuration.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150013_simulated_financial_memberships.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/202611150014_fix_deferred_ledger_balance_trigger.sql
        env:
          PGPASSWORD: postgres
      - name: Assert marketplace RLS and write boundaries
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/migration_assertions.sql
        env:
          PGPASSWORD: postgres
      - name: Exercise client and freelancer RLS workflows
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/marketplace_rls_workflows.sql
        env:
          PGPASSWORD: postgres
      - name: Exercise social marketplace RLS and direct connection workflows
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/social_marketplace_rls_workflows.sql
        env:
          PGPASSWORD: postgres
      - name: Exercise contract, block, report, and message retention workflows
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/safety_contract_rls_workflows.sql
        env:
          PGPASSWORD: postgres
      - name: Exercise administrator, support, and moderation boundaries
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/admin_support_rls_workflows.sql
        env:
          PGPASSWORD: postgres
      - name: Exercise financial sandbox and membership authorization
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/financial_sandbox_rls_workflows.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/financial_contract_rls_workflows.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/financial_ledger_balance_trigger.sql
        env:
          PGPASSWORD: postgres
